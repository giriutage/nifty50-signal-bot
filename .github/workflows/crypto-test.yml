name: BTC scheduler test

# TEMPORARY. Measures the one thing that keeps breaking: how late GitHub
# actually starts a SCHEDULED workflow.
#
# NSE gives one sample per trading day, and the last two were 8-10 hours late
# so nothing was delivered at all. BTC trades 24/7, so this samples the same
# scheduler every 30 minutes and answers the question in hours.
#
# Every run announces its wake time to Telegram - that timestamp against the
# cron slot below IS the measurement. Signals follow if any fire.
#
# Off-peak minutes deliberately: :00/:30 coincided with the 8-10 hour delays.
#   UTC :11 and :41, every hour, every day.
#
# DELETE THIS WORKFLOW once the question is answered - it is a diagnostic, not
# part of the bot.
on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:

concurrency:
  group: crypto-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Watch BTC
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BOT_MODE: crypto
          TEST_SYMBOLS: BTCUSDT
          TEST_INTERVAL: '1'     # 1-minute bars
          RUN_MINUTES: '25'      # covers most of the 30-minute gap
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u tv_signal_bot.py

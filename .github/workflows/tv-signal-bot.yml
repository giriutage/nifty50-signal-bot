name: NIFTY50 Signal Bot

# ONE job per trading day, held open for the whole session.
#
# GitHub's cron is best-effort: it was observed dropping roughly half the
# scheduled runs on this repo and starting the rest 5-22 minutes late. So
# instead of asking it to fire 12 times a day, we ask once and let the job
# sleep to each bar close itself. A sleep is exact; a queue is not.
#
# Start triggers are spread across the WHOLE session, every 30 minutes.
#
# Clustering them (09:36/09:39/09:42) failed on 2026-08-26: GitHub ran the
# trigger 43 minutes late, so all three were late together and the 09:45 and
# 10:15 bars were lost. Spreading them means a dropped or delayed trigger
# only costs the bars before the next one lands, instead of the whole day.
#
# The concurrency group keeps exactly one session live: while a job runs,
# later triggers queue, and the one still pending when the session ends finds
# no bar closes left and exits in seconds. Public repo, so the extra queued
# runs cost nothing.
#
#   UTC 04:06, 04:36 ... 09:36  =  IST 09:36, 10:06 ... 15:06
#   First bar closes 09:45 IST, last 15:15 IST.
on:
  schedule:
    - cron: '6,36 4-9 * * 1-5'
  repository_dispatch:
    types: [scan]
  workflow_dispatch:
    inputs:
      mode:
        description: 'nse = single production scan · crypto = BTC 1-min live test'
        type: choice
        options: [nse, crypto]
        default: nse
      run_minutes:
        description: 'crypto mode only: how long to watch, in minutes'
        default: '60'

concurrency:
  group: trading-session
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    # Session runs ~09:36 -> 15:16 IST (5h40m). GitHub's hard job ceiling is
    # 6h; this stops short of it deliberately.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trading session
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BOT_MODE: ${{ github.event.inputs.mode || 'nse' }}
          RUN_MINUTES: ${{ github.event.inputs.run_minutes || '60' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
        run: python -u tv_signal_bot.py

name: NIFTY50 Signal Bot

# NSE 30-min bars close at :15 and :45 IST.
#
# Measured feed lag (bar close -> bar available) is ~2 seconds, so the feed
# is not the constraint. GitHub's scheduler is: it runs cron on a best-effort
# basis and can start jobs many minutes late.
#
# So we fire ~3 minutes BEFORE each close and let the script wait out the
# remaining time precisely. A late start is detected and skips the wait.
#
#   IST :12  ->  UTC :42 (previous hour)
#   IST :42  ->  UTC :12
# UTC 04:12 = IST 09:42 (first close 09:45) .. UTC 09:42 = IST 15:12 (last close 15:15)
#
# GitHub's cron is BEST-EFFORT and was observed skipping scheduled runs
# entirely on this repo. `repository_dispatch` is honoured immediately, so
# an external scheduler (cron-job.org) pings it on an exact schedule and
# is the primary trigger. The cron below is kept only as a free backup for
# whenever GitHub does decide to honour it.
on:
  repository_dispatch:
    types: [scan]
  schedule:
    - cron: '12,42 4-9 * * 1-5'
  workflow_dispatch:

# NO concurrency group here, deliberately.
#
# GitHub keeps at most ONE pending run per concurrency group: when a third
# run arrives while one is running and one is queued, the QUEUED one is
# silently cancelled. Because GitHub starts these runs 5-22 minutes late,
# they pile up and collide, and that silently dropped roughly every other
# bar. Overlapping runs are harmless here - each one independently
# evaluates the most recent closed bar - so letting them all through is
# strictly better than losing them.

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # allows for the in-script wait to the bar boundary

    steps:
      # v5 / v6 run on Node 24. The older v4 / v5 target the deprecated
      # Node 20 and are only being force-migrated by the runner for now.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan for signals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
        run: python tv_signal_bot.py

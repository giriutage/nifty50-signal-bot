name: NIFTY50 Signal Bot

# ONE job per trading day, held open for the whole session.
#
# GitHub's cron is best-effort: it was observed dropping roughly half the
# scheduled runs on this repo and starting the rest 5-22 minutes late. So
# instead of asking it to fire 12 times a day, we ask once and let the job
# sleep to each bar close itself. A sleep is exact; a queue is not.
#
# Three start triggers three minutes apart give redundancy against a dropped
# trigger. The concurrency group ensures only one job is ever live, and the
# script exits immediately if it finds itself starting as the session ends.
#
#   UTC 04:06 / 04:09 / 04:12  =  IST 09:36 / 09:39 / 09:42
#   First bar closes 09:45 IST, last 15:15 IST.
on:
  schedule:
    - cron: '6,9,12 4 * * 1-5'
  repository_dispatch:
    types: [scan]
  workflow_dispatch:

concurrency:
  group: trading-session
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    # Session runs ~09:36 -> 15:16 IST (5h40m). GitHub's hard job ceiling is
    # 6h; this stops short of it deliberately.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trading session
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
        run: python -u tv_signal_bot.py

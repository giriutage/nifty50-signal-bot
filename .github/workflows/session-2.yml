name: Session 2 (11:15-12:15)

# Phase 2 of 4. See session-1.yml for why the day is split this way.
#
# Closes: 11:15, 11:45, 12:15 IST   (job ends ~12:16)
# Triggers: UTC 01:07 -> 03:53  =  IST 06:37 -> 09:23
# Margin from last trigger to first close: 112 min  (worst seen: 54)
# Longest run: 06:37 -> 12:16 = 5h39m, inside the 6h ceiling.
on:
  schedule:
    - cron: '7,23,39,53 1-3 * * 1-5'

concurrency:
  group: session-2
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run session phase 2
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PHASE_FIRST_CLOSE: '11:15'
          PHASE_LAST_CLOSE: '12:15'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
        run: python -u tv_signal_bot.py

name: Session 4 (14:15-15:15)

# Phase 4 of 4. See session-1.yml for why the day is split this way.
#
# Closes: 14:15, 14:45, 15:15 IST   (job ends ~15:16)
# Triggers: UTC 04:07 -> 04:53  =  IST 09:37 -> 10:23
# Margin from last trigger to first close: 232 min  (GitHub now runs +125)
# Longest run: 09:37 -> 15:16 = 5h39m, inside the 6h ceiling.
on:
  schedule:
    - cron: '7,23,39,53 4 * * 1-5'

concurrency:
  group: session-4
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run session phase 4
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PHASE_FIRST_CLOSE: '14:15'
          PHASE_LAST_CLOSE: '15:15'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
        run: python -u tv_signal_bot.py

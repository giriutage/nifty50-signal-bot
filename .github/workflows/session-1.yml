name: Session 1 (09:45-10:45)

# ---------------------------------------------------------------------------
# The trading day is split into FOUR phases. Each covers three bar closes.
#
# WHERE THE TRIGGER WINDOW ENDS IS WHAT MATTERS - not how wide it is.
#
# Measured 31 Aug / 1 Sep: GitHub does not sample randomly from a workflow's
# cron slots. It fires ONE run per workflow per day, at or shortly after the
# LAST slot (+1, +5, +30, +45, +54 min observed).
#
# The previous design widened windows by extending them LATER, so phase 1's
# triggers ran to 10:23 - past the 09:45 and 10:15 closes. GitHub duly fired at
# 10:23+, when those bars were already unreachable. It delivered 0/12 bars on
# 31 Aug and 4/12 on 1 Sep.
#
# So each phase's LAST trigger now sits well BEFORE its FIRST close, leaving
# more margin than the worst lateness seen (+54 min). Extra triggers earlier in
# the window are harmless redundancy; the last one is what actually fires.
#
# Minutes stay off :00/:30, which coincided with 8-10 hour delays on 27-28 Aug.
# Phases cover disjoint closes, so they cannot double-alert. Each has its own
# concurrency group so no phase queues behind another.
# ---------------------------------------------------------------------------
#
# Closes: 09:45, 10:15, 10:45 IST   (job ends ~10:46)
# Triggers: UTC 00:07 -> 02:53  =  IST 05:37 -> 08:23
# Margin from last trigger to first close: 82 min  (worst seen: 54)
# Longest run: 05:37 -> 10:46 = 5h09m, inside the 6h ceiling.
on:
  schedule:
    - cron: '7,23,39,53 0-2 * * 1-5'

concurrency:
  group: session-1
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run session phase 1
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PHASE_FIRST_CLOSE: '09:45'
          PHASE_LAST_CLOSE: '10:45'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
        run: python -u tv_signal_bot.py
